<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Lán Trại 6.000 Công Nhân - Sơ Đồ Giường & Tab Nam Nữ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Thư viện Excel (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Thư viện quét Camera QR CCCD -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- ICONS SVG ---
    const IconCamera = () => <svg className="w-4 h-4 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
    const IconPlus = () => <svg className="w-4 h-4 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconDownload = () => <svg className="w-4 h-4 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconWrench = () => <svg className="w-3.5 h-3.5 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
    const IconLock = () => <svg className="w-3.5 h-3.5 text-rose-600 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconTransfer = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>;
    const IconLogOut = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    const IconAlert = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconHistory = () => <svg className="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>;

    // Khởi tạo 25 dãy x 14 phòng trống hoàn toàn (350 phòng)
    const generateInitialData = () => {
      const data = [];
      for (let b = 1; b <= 25; b++) {
        for (let r = 1; r <= 14; r++) {
          const roomId = `D${String(b).padStart(2, '0')}-P${String(r).padStart(2, '0')}`;
          // Mặc định: Dãy lẻ là Nam, Dãy chẵn là Nữ, phòng 14 là Kho
          let type = r === 14 ? 'storage' : (b % 2 === 0 ? 'female' : 'male');
          
          data.push({
            id: roomId,
            block: b,
            roomNumber: r,
            type, // 'male' | 'female' | 'mixed' | 'storage'
            capacity: 20,
            occupancy: 0,
            isMaintenance: false,
            hasChange: false,
            workers: [] // Danh sách chứa tối đa 20 công nhân tương ứng 20 giường
          });
        }
      }
      return data;
    };

    function App() {
      const [rooms, setRooms] = useState(generateInitialData);
      const [history, setHistory] = useState([]);
      
      // Bộ lọc
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedBlock, setSelectedBlock] = useState('ALL');
      const [selectedType, setSelectedType] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL');

      // Modals
      const [activeModal, setActiveModal] = useState(null);
      const [currentRoom, setCurrentRoom] = useState(null);
      const [selectedWorker, setSelectedWorker] = useState(null);
      const [targetRoomId, setTargetRoomId] = useState('');

      // Form nhập công nhân
      const [formData, setFormData] = useState({
        citizenId: '', name: '', gender: 'female', birthDate: '1998-05-12', hometown: '', roomId: '', bedIndex: 1
      });
      const [rawQrText, setRawQrText] = useState('');

      // Thống kê KPIs
      const stats = useMemo(() => {
        let totalRooms = rooms.length;
        let totalOccupants = 0;
        let totalCapacity = 0;
        let maleCount = 0;
        let femaleCount = 0;

        rooms.forEach(r => {
          if (r.type !== 'storage' && !r.isMaintenance) {
            totalCapacity += r.capacity;
          }
          totalOccupants += r.occupancy;
          r.workers.forEach(w => {
            if (w.gender === 'female') femaleCount++;
            else maleCount++;
          });
        });

        return {
          totalRooms,
          totalOccupants,
          availableSlots: totalCapacity - totalOccupants,
          maleCount,
          femaleCount
        };
      }, [rooms]);

      // Thay đổi loại phòng linh hoạt (Tab Nam/Nữ/Chung/Kho)
      const handleUpdateRoomType = (roomId, newType) => {
        setRooms(prev => prev.map(r => {
          if (r.id === roomId) {
            return { ...r, type: newType, hasChange: true };
          }
          return r;
        }));
      };

      // Bộ lọc phòng hiển thị
      const filteredRooms = useMemo(() => {
        return rooms.filter(room => {
          const matchBlock = selectedBlock === 'ALL' || room.block === parseInt(selectedBlock);
          const matchType = selectedType === 'ALL' || room.type === selectedType;
          
          let matchStatus = true;
          if (selectedStatus === 'AVAILABLE') matchStatus = room.occupancy < 20 && !room.isMaintenance && room.type !== 'storage';
          else if (selectedStatus === 'FULL') matchStatus = room.occupancy >= 20;
          else if (selectedStatus === 'MAINTENANCE') matchStatus = room.isMaintenance;
          else if (selectedStatus === 'HAS_CHANGE') matchStatus = room.hasChange;

          let matchSearch = true;
          if (searchTerm.trim() !== '') {
            const query = searchTerm.toLowerCase();
            const matchRoomId = room.id.toLowerCase().includes(query);
            const matchWorker = room.workers.some(
              w => w.name.toLowerCase().includes(query) || w.citizenId.includes(query)
            );
            matchSearch = matchRoomId || matchWorker;
          }

          return matchBlock && matchType && matchStatus && matchSearch;
        });
      }, [rooms, selectedBlock, selectedType, selectedStatus, searchTerm]);

      // Danh sách các phòng còn chỗ phù hợp với giới tính
      const availableRoomsList = useMemo(() => {
        return rooms.filter(r => !r.isMaintenance && r.type !== 'storage' && r.occupancy < 20);
      }, [rooms]);

      // Khởi động Camera quét CCCD
      useEffect(() => {
        let html5QrCode = null;
        if (activeModal === 'SCAN') {
          html5QrCode = new Html5Qrcode("reader");
          html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
              parseAndFillCCCD(decodedText);
              html5QrCode.stop().then(() => setActiveModal('ADD_WORKER'));
            },
            () => {}
          ).catch(err => {
            console.warn("Camera không khả dụng:", err);
          });
        }
        return () => {
          if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
          }
        };
      }, [activeModal]);

      // Phân tích mã QR CCCD
      const parseAndFillCCCD = (text) => {
        const parts = text.split('|');
        if (parts.length >= 6) {
          const citizenId = parts[0];
          const name = parts[2];
          const rawDob = parts[3];
          const birthDate = rawDob.length === 8 ? `${rawDob.substring(4,8)}-${rawDob.substring(2,4)}-${rawDob.substring(0,2)}` : '1995-01-01';
          const gender = parts[4].toLowerCase().includes('nữ') ? 'female' : 'male';
          const hometown = parts[5];
          setFormData({
            citizenId, name, gender, birthDate, hometown,
            roomId: availableRoomsList[0]?.id || '',
            bedIndex: 1
          });
        } else {
          setFormData(prev => ({ ...prev, citizenId: text }));
        }
      };

      // Xếp công nhân vào giường phòng chỉ định
      const handleAddWorker = () => {
        if (!formData.name || !formData.citizenId || !formData.roomId) {
          alert("Vui lòng điền đầy đủ thông tin!");
          return;
        }

        const targetRoom = rooms.find(r => r.id === formData.roomId);
        if (targetRoom) {
          // Kiểm tra quy tắc giới tính nếu không phải phòng chung
          if (targetRoom.type === 'male' && formData.gender === 'female') {
            if (!confirm("Phòng này là phòng NAM riêng. Bạn có chắc muốn xếp công nhân NỮ vào không? (Nếu đồng ý, hệ thống khuyến nghị chuyển sang phòng Ở Chung)")) return;
          }
          if (targetRoom.type === 'female' && formData.gender === 'male') {
            if (!confirm("Phòng này là phòng NỮ riêng. Bạn có chắc muốn xếp công nhân NAM vào không?")) return;
          }
        }

        setRooms(prev => prev.map(r => {
          if (r.id === formData.roomId) {
            const nextBed = r.workers.length + 1;
            const newWorker = {
              ...formData,
              id: `CN-${r.id}-G${String(nextBed).padStart(2, '0')}`,
              bedNumber: nextBed
            };
            return {
              ...r,
              occupancy: r.occupancy + 1,
              hasChange: true,
              workers: [...r.workers, newWorker]
            };
          }
          return r;
        }));

        setHistory(prev => [{
          id: Date.now(),
          time: new Date().toLocaleTimeString('vi-VN'),
          name: formData.name,
          gender: formData.gender,
          citizenId: formData.citizenId,
          type: 'Tiếp nhận mới',
          from: '---',
          to: `${formData.roomId} (Giường ${rooms.find(r => r.id === formData.roomId)?.workers.length + 1})`
        }, ...prev]);

        setActiveModal(null);
      };

      // Chuyển phòng
      const handleTransfer = () => {
        if (!currentRoom || !selectedWorker || !targetRoomId) return;

        setRooms(prev => prev.map(r => {
          if (r.id === currentRoom.id) {
            return {
              ...r,
              occupancy: r.occupancy - 1,
              hasChange: true,
              workers: r.workers.filter(w => w.id !== selectedWorker.id)
            };
          }
          if (r.id === targetRoomId) {
            const nextBed = r.workers.length + 1;
            return {
              ...r,
              occupancy: r.occupancy + 1,
              hasChange: true,
              workers: [...r.workers, { ...selectedWorker, bedNumber: nextBed }]
            };
          }
          return r;
        }));

        setHistory(prev => [{
          id: Date.now(),
          time: new Date().toLocaleTimeString('vi-VN'),
          name: selectedWorker.name,
          gender: selectedWorker.gender,
          citizenId: selectedWorker.citizenId,
          type: 'Đổi phòng',
          from: currentRoom.id,
          to: targetRoomId
        }, ...prev]);

        setActiveModal(null);
      };

      // Trả phòng
      const handleCheckout = () => {
        if (!currentRoom || !selectedWorker) return;

        setRooms(prev => prev.map(r => {
          if (r.id === currentRoom.id) {
            return {
              ...r,
              occupancy: r.occupancy - 1,
              hasChange: true,
              workers: r.workers.filter(w => w.id !== selectedWorker.id)
            };
          }
          return r;
        }));

        setHistory(prev => [{
          id: Date.now(),
          time: new Date().toLocaleTimeString('vi-VN'),
          name: selectedWorker.name,
          gender: selectedWorker.gender,
          citizenId: selectedWorker.citizenId,
          type: 'Trả phòng (Nghỉ việc)',
          from: currentRoom.id,
          to: 'RỜI KHỎI LÁN TRẠI'
        }, ...prev]);

        setActiveModal(null);
      };

      // Bật/tắt bảo trì
      const toggleMaintenance = (roomId) => {
        setRooms(prev => prev.map(r => {
          if (r.id === roomId) {
            return { ...r, isMaintenance: !r.isMaintenance, hasChange: true };
          }
          return r;
        }));
        setActiveModal(null);
      };

      // Xuất Excel
      const exportExcel = () => {
        const listResidents = [];
        rooms.forEach(r => {
          r.workers.forEach(w => {
            listResidents.push({
              'Dãy': `Dãy ${r.block}`,
              'Mã Phòng': r.id,
              'Chế Độ Phòng': r.type === 'female' ? 'Nữ riêng' : (r.type === 'male' ? 'Nam riêng' : 'Ở chung'),
              'Số Giường': `Giường ${w.bedNumber || '---'}`,
              'Họ và Tên': w.name,
              'Giới Tính': w.gender === 'female' ? 'Nữ' : 'Nam',
              'Số CCCD': w.citizenId,
              'Ngày Sinh': w.birthDate,
              'Quê Quán': w.hometown || 'Chưa cập nhật'
            });
          });
        });

        const listHistory = history.map(h => ({
          'Thời Gian': h.time,
          'Họ và Tên': h.name,
          'Giới Tính': h.gender === 'female' ? 'Nữ' : 'Nam',
          'Số CCCD': h.citizenId,
          'Loại Biến Động': h.type,
          'Từ Phòng': h.from,
          'Đến Phòng': h.to
        }));

        const wb = XLSX.utils.book_new();
        const wsResidents = XLSX.utils.json_to_sheet(listResidents);
        const wsHistory = XLSX.utils.json_to_sheet(listHistory);

        XLSX.utils.book_append_sheet(wb, wsResidents, "Danh Sach Luu Tru");
        XLSX.utils.book_append_sheet(wb, wsHistory, "Bien Dong Trong Ngay");

        XLSX.writeFile(wb, `Quan_Ly_Lan_Trai_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      return (
        <div className="min-h-screen flex flex-col pb-12">
          {/* HEADER & THANH ĐIỀU KHIỂN */}
          <header className="sticky top-0 z-30 bg-white border-b border-slate-200 shadow-sm">
            <div className="px-6 py-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-6">
                <h1 className="text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                  <span className="w-3 h-6 bg-indigo-600 rounded-sm inline-block"></span>
                  LÁN TRẠI 6.000 CÔNG NHÂN
                </h1>
                <div className="flex items-center gap-4 text-xs font-medium text-slate-600 border-l border-slate-200 pl-6">
                  <span>Tổng: <strong className="text-slate-800">{stats.totalRooms} phòng</strong></span>
                  <span>Đang ở: <strong className="text-emerald-700 font-bold">{stats.totalOccupants.toLocaleString()}</strong></span>
                  <span>Còn trống: <strong className="text-amber-600 font-bold">{stats.availableSlots.toLocaleString()} chỗ</strong></span>
                  <span className="flex items-center gap-2 pl-2 border-l border-slate-200">
                    <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-semibold border border-blue-200">♂ {stats.maleCount} Nam</span>
                    <span className="text-pink-600 bg-pink-50 px-2 py-0.5 rounded font-semibold border border-pink-200">♀ {stats.femaleCount} Nữ</span>
                  </span>
                </div>
              </div>

              {/* Cụm nút hành động */}
              <div className="flex items-center gap-2.5">
                <button 
                  onClick={() => setActiveModal('SCAN')}
                  className="flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition"
                >
                  <IconCamera /> Quét CCCD
                </button>
                <button 
                  onClick={() => {
                    setFormData({ citizenId: '', name: '', gender: 'female', birthDate: '1998-05-12', hometown: '', roomId: availableRoomsList[0]?.id || '', bedIndex: 1 });
                    setActiveModal('ADD_WORKER');
                  }}
                  className="flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold shadow-sm transition"
                >
                  <IconPlus /> Thêm nhanh
                </button>
                <button 
                  onClick={exportExcel}
                  className="flex items-center gap-1.5 px-3.5 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-medium transition shadow-xs"
                >
                  <IconDownload /> Xuất Excel
                </button>
                <button 
                  onClick={() => setActiveModal('HISTORY')}
                  title="Nhật ký biến động"
                  className="p-2 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-lg"
                >
                  <IconHistory />
                </button>
              </div>
            </div>

            {/* Thanh công cụ tìm kiếm và lọc */}
            <div className="px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 bg-slate-50/70">
              <div className="flex items-center gap-3 flex-1 min-w-[320px]">
                <div className="relative flex-1 max-w-md">
                  <span className="absolute left-3 top-2.5"><IconSearch /></span>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Tìm tên công nhân, số CCCD, mã phòng (vd: D01-P05)..."
                    className="w-full pl-9 pr-4 py-1.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                  />
                </div>

                <select
                  value={selectedBlock}
                  onChange={(e) => setSelectedBlock(e.target.value)}
                  className="bg-white border border-slate-300 text-slate-700 py-1.5 px-3 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                  <option value="ALL">Tất cả Dãy (1 - 25)</option>
                  {Array.from({ length: 25 }, (_, i) => (
                    <option key={i + 1} value={i + 1}>Dãy {i + 1}</option>
                  ))}
                </select>

                {/* Tab Lọc theo Chế độ phòng */}
                <select
                  value={selectedType}
                  onChange={(e) => setSelectedType(e.target.value)}
                  className="bg-white border border-slate-300 text-slate-700 py-1.5 px-3 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                  <option value="ALL">Tất cả loại phòng</option>
                  <option value="male">Phòng Nam riêng (♂)</option>
                  <option value="female">Phòng Nữ riêng (♀)</option>
                  <option value="mixed">Phòng Ở Chung (⚥)</option>
                  <option value="storage">Phòng Kho (📦)</option>
                </select>

                <select
                  value={selectedStatus}
                  onChange={(e) => setSelectedStatus(e.target.value)}
                  className="bg-white border border-slate-300 text-slate-700 py-1.5 px-3 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                  <option value="ALL">Mọi trạng thái</option>
                  <option value="AVAILABLE">Còn giường trống</option>
                  <option value="FULL">Đủ 20/20 (Khóa)</option>
                  <option value="HAS_CHANGE">Có biến động hôm nay</option>
                  <option value="MAINTENANCE">🔧 Đang bảo trì</option>
                </select>
              </div>

              {/* Chú giải giường và màu sắc */}
              <div className="flex items-center gap-3 text-xs text-slate-600">
                <span className="flex items-center gap-1.5">
                  <span className="w-3.5 h-3.5 bg-pink-100 border border-pink-300 rounded"></span> Giường Nữ (Hồng)
                </span>
                <span className="flex items-center gap-1.5">
                  <span className="w-3.5 h-3.5 bg-blue-50 border border-blue-200 rounded"></span> Giường Nam (Xanh)
                </span>
                <span className="flex items-center gap-1.5">
                  <span className="w-3.5 h-3.5 bg-white border border-slate-200 rounded"></span> Giường trống
                </span>
                <span className="flex items-center gap-1.5">
                  <span className="w-3.5 h-3.5 bg-rose-100 border border-rose-400 rounded"></span> Phòng Đủ 20 người
                </span>
              </div>
            </div>
          </header>

          {/* LƯỚI PHÒNG 300 PHÒNG */}
          <main className="flex-1 p-6 overflow-y-auto">
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
              {filteredRooms.map((room) => {
                let cardStyle = "bg-white border-slate-200";
                if (room.isMaintenance) cardStyle = "bg-amber-50/70 border-amber-300 ring-1 ring-amber-300";
                else if (room.occupancy >= 20) cardStyle = "bg-rose-50 border-rose-400 ring-1 ring-rose-400";
                else if (room.hasChange) cardStyle = "bg-sky-50 border-sky-300 ring-1 ring-sky-300";

                return (
                  <div key={room.id} className={`rounded-xl border p-3.5 flex flex-col justify-between shadow-xs transition hover:shadow-md ${cardStyle}`}>
                    <div>
                      {/* Tiêu đề phòng & Tab lựa chọn Nam/Nữ/Chung */}
                      <div className="flex items-center justify-between gap-1 mb-2.5">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-800 text-sm tracking-wide">{room.id}</span>
                          
                          {/* TAB ĐIỀU CHỈNH CHẾ ĐỘ PHÒNG */}
                          <select
                            value={room.type}
                            onChange={(e) => handleUpdateRoomType(room.id, e.target.value)}
                            className={`text-[11px] font-bold py-0.5 px-1.5 rounded border focus:outline-none transition cursor-pointer ${
                              room.type === 'female' 
                                ? 'bg-pink-50 border-pink-300 text-pink-700' 
                                : room.type === 'male'
                                ? 'bg-blue-50 border-blue-300 text-blue-700'
                                : room.type === 'mixed'
                                ? 'bg-purple-50 border-purple-300 text-purple-700'
                                : 'bg-slate-100 border-slate-300 text-slate-700'
                            }`}
                          >
                            <option value="male">♂ Nam riêng</option>
                            <option value="female">♀ Nữ riêng</option>
                            <option value="mixed">⚥ Ở chung</option>
                            <option value="storage">📦 Kho</option>
                          </select>
                        </div>

                        {room.isMaintenance ? (
                          <span className="flex items-center gap-0.5 bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold animate-pulse">
                            <IconWrench /> Bảo trì
                          </span>
                        ) : room.occupancy >= 20 ? (
                          <span title="Phòng đã đủ 20/20"><IconLock /></span>
                        ) : null}
                      </div>

                      {/* Tiến độ và Sĩ số */}
                      <div className="mb-3">
                        <div className="flex items-center justify-between text-xs mb-1">
                          <span className="text-slate-500 font-medium">Sĩ số phòng:</span>
                          <span className={`font-semibold ${room.occupancy >= 20 ? 'text-rose-600' : 'text-slate-700'}`}>
                            {room.occupancy}/20 người
                          </span>
                        </div>
                        <div className="w-full h-1.5 bg-slate-200/70 rounded-full overflow-hidden">
                          <div 
                            className={`h-full transition-all duration-300 ${
                              room.isMaintenance ? 'bg-amber-400' :
                              room.occupancy >= 20 ? 'bg-rose-500' :
                              room.hasChange ? 'bg-sky-500' : 'bg-emerald-500'
                            }`}
                            style={{ width: `${(room.occupancy / room.capacity) * 100}%` }}
                          />
                        </div>
                      </div>

                      {/* SƠ ĐỒ 20 GIƯỜNG NGỦ CHI TIẾT */}
                      <div className="mb-2">
                        <div className="text-[10px] uppercase font-bold text-slate-400 mb-1 tracking-wider">Sơ đồ 20 giường:</div>
                        <div className="grid grid-cols-4 gap-1 max-h-36 overflow-y-auto p-1 bg-slate-50/70 rounded-lg border border-slate-100">
                          {Array.from({ length: 20 }, (_, idx) => {
                            const bedNum = idx + 1;
                            const occupant = room.workers[idx]; // Công nhân gán tại giường này
                            const isFemale = occupant && occupant.gender === 'female';

                            return (
                              <div
                                key={bedNum}
                                title={occupant ? `${occupant.name} (${occupant.gender === 'female' ? 'Nữ' : 'Nam'}) - ${occupant.citizenId}` : `Giường G${String(bedNum).padStart(2, '0')} (Còn trống)`}
                                className={`h-8 rounded p-1 text-[9px] flex flex-col justify-between border transition leading-tight ${
                                  !occupant 
                                    ? 'bg-white border-dashed border-slate-200 text-slate-400 hover:border-slate-300' 
                                    : isFemale
                                    ? 'bg-pink-100/90 border-pink-300 text-pink-800 font-medium' // GIƯỜNG NỮ: NỀN HỒNG NHẠT
                                    : 'bg-blue-50/90 border-blue-200 text-blue-800 font-medium' // GIƯỜNG NAM: XANH NHẠT
                                }`}
                              >
                                <div className="flex items-center justify-between">
                                  <span className="font-mono text-[8px] opacity-75">G{String(bedNum).padStart(2, '0')}</span>
                                  {occupant && (
                                    <span className="text-[9px] font-bold">{isFemale ? '♀' : '♂'}</span>
                                  )}
                                </div>
                                <div className="truncate font-semibold">
                                  {occupant ? occupant.name.split(' ').pop() : '---'}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {/* Thanh tác vụ nhanh */}
                    <div className="pt-2 border-t border-slate-200/60 grid grid-cols-3 gap-1">
                      <button 
                        disabled={room.isMaintenance || room.occupancy === 0}
                        onClick={() => {
                          setCurrentRoom(room);
                          setSelectedWorker(room.workers[0]);
                          setTargetRoomId(availableRoomsList[0]?.id || '');
                          setActiveModal('TRANSFER');
                        }}
                        title="Đổi phòng"
                        className="flex items-center justify-center p-1 rounded hover:bg-slate-200/60 disabled:opacity-30 text-slate-600 transition"
                      >
                        <IconTransfer />
                      </button>
                      <button 
                        disabled={room.occupancy === 0}
                        onClick={() => {
                          setCurrentRoom(room);
                          setSelectedWorker(room.workers[0]);
                          setActiveModal('CHECKOUT');
                        }}
                        title="Trả phòng / Check-out"
                        className="flex items-center justify-center p-1 rounded hover:bg-rose-100 disabled:opacity-30 text-rose-600 transition"
                      >
                        <IconLogOut />
                      </button>
                      <button 
                        onClick={() => {
                          setCurrentRoom(room);
                          setActiveModal('MAINTENANCE');
                        }}
                        title="Báo hỏng / Chế độ bảo trì"
                        className={`flex items-center justify-center p-1 rounded transition ${room.isMaintenance ? 'bg-amber-100 text-amber-700' : 'hover:bg-amber-100 text-amber-600'}`}
                      >
                        <IconAlert />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* --- CÁC HỘP THOẠI (MODALS) --- */}

          {/* Modal 1: Quét Camera CCCD */}
          {activeModal === 'SCAN' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <IconCamera /> Quét Mã QR Căn Cước Công Dân
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div id="reader" className="w-full rounded-lg overflow-hidden bg-slate-50 mb-3 border border-dashed border-slate-300"></div>

                <p className="text-xs text-slate-500 mb-2">Hoặc dán chuỗi QR quét được từ máy đọc cầm tay:</p>
                <textarea
                  value={rawQrText}
                  onChange={(e) => setRawQrText(e.target.value)}
                  placeholder="Dán chuỗi số CCCD|CMND|Họ tên|Ngày sinh|Giới tính|Địa chỉ..."
                  className="w-full text-xs p-2 border border-slate-300 rounded mb-4"
                  rows="3"
                ></textarea>

                <div className="flex justify-end gap-2">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-lg text-sm">Đóng</button>
                  <button 
                    onClick={() => {
                      parseAndFillCCCD(rawQrText);
                      setActiveModal('ADD_WORKER');
                    }}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold"
                  >
                    Bóc tách dữ liệu
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 2: Điền thông tin và xếp phòng/giường */}
          {activeModal === 'ADD_WORKER' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="font-bold text-slate-800">Tiếp Nhận Công Nhân & Xếp Giường</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="space-y-3 text-sm mb-5">
                  <div>
                    <label className="text-xs text-slate-500 block mb-1">Số Căn cước công dân (12 số)</label>
                    <input 
                      type="text" 
                      value={formData.citizenId} 
                      onChange={(e) => setFormData({...formData, citizenId: e.target.value})}
                      className="w-full border border-slate-300 rounded p-1.5 font-mono"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 block mb-1">Họ và tên</label>
                    <input 
                      type="text" 
                      value={formData.name} 
                      onChange={(e) => setFormData({...formData, name: e.target.value})}
                      className="w-full border border-slate-300 rounded p-1.5 font-medium"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">Giới tính</label>
                      <select 
                        value={formData.gender} 
                        onChange={(e) => setFormData({...formData, gender: e.target.value})}
                        className={`w-full border rounded p-1.5 font-bold ${formData.gender === 'female' ? 'border-pink-300 bg-pink-50 text-pink-700' : 'border-blue-300 bg-blue-50 text-blue-700'}`}
                      >
                        <option value="female">♀ Nữ (Màu hồng)</option>
                        <option value="male">♂ Nam</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-slate-500 block mb-1">Ngày sinh</label>
                      <input 
                        type="date" 
                        value={formData.birthDate} 
                        onChange={(e) => setFormData({...formData, birthDate: e.target.value})}
                        className="w-full border border-slate-300 rounded p-1.5"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 block mb-1">Quê quán / Thường trú</label>
                    <input 
                      type="text" 
                      value={formData.hometown} 
                      onChange={(e) => setFormData({...formData, hometown: e.target.value})}
                      className="w-full border border-slate-300 rounded p-1.5"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-700 block mb-1 font-bold">Chỉ định phòng ở (&lt; 20 người):</label>
                    <select 
                      value={formData.roomId} 
                      onChange={(e) => setFormData({...formData, roomId: e.target.value})}
                      className="w-full border border-slate-300 rounded p-2 text-sm font-semibold bg-emerald-50 text-emerald-900"
                    >
                      {availableRoomsList.map(r => {
                        const typeLabel = r.type === 'female' ? '♀ Nữ riêng' : (r.type === 'male' ? '♂ Nam riêng' : '⚥ Ở chung');
                        return (
                          <option key={r.id} value={r.id}>
                            {r.id} - [{typeLabel}] - Đang ở: {r.occupancy}/20 người
                          </option>
                        );
                      })}
                    </select>
                  </div>
                </div>

                <div className="flex justify-end gap-2">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-lg text-sm">Hủy</button>
                  <button onClick={handleAddWorker} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold">
                    Xác nhận Xếp Vào Giường
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 3: Đổi phòng */}
          {activeModal === 'TRANSFER' && currentRoom && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="font-bold text-slate-800 mb-2">Đổi Phòng Cho Công Nhân</h3>
                <p className="text-xs text-slate-500 mb-4">Hiện đang ở: <strong>{currentRoom.id}</strong></p>

                <div className="mb-4">
                  <label className="text-xs text-slate-500 block mb-1">Chọn công nhân chuyển đi:</label>
                  <select 
                    value={selectedWorker?.id} 
                    onChange={(e) => setSelectedWorker(currentRoom.workers.find(w => w.id === e.target.value))}
                    className="w-full border border-slate-300 rounded p-2 text-sm"
                  >
                    {currentRoom.workers.map(w => (
                      <option key={w.id} value={w.id}>{w.name} - {w.citizenId} ({w.gender === 'female' ? 'Nữ' : 'Nam'})</option>
                    ))}
                  </select>
                </div>

                <div className="mb-5">
                  <label className="text-xs text-slate-500 block mb-1 font-bold">Chuyển sang phòng mới:</label>
                  <select 
                    value={targetRoomId} 
                    onChange={(e) => setTargetRoomId(e.target.value)}
                    className="w-full border border-slate-300 rounded p-2 text-sm font-semibold"
                  >
                    {availableRoomsList.filter(r => r.id !== currentRoom.id).map(r => (
                      <option key={r.id} value={r.id}>
                        {r.id} ({r.type === 'female' ? '♀ Nữ' : (r.type === 'male' ? '♂ Nam' : '⚥ Ở chung')}) - Còn trống {20 - r.occupancy} giường
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex justify-end gap-2">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-lg text-sm">Hủy</button>
                  <button onClick={handleTransfer} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold">
                    Lưu Biến Động Đổi Phòng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 4: Check-out Trả phòng */}
          {activeModal === 'CHECKOUT' && currentRoom && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="font-bold text-rose-600 mb-2">Xác Nhận Trả Phòng / Nghỉ Việc</h3>
                <p className="text-xs text-slate-500 mb-4">Giải phóng giường ngủ và lưu lịch sử rời đi của công nhân.</p>

                <div className="mb-5">
                  <label className="text-xs text-slate-500 block mb-1">Chọn công nhân rời lán trại:</label>
                  <select 
                    value={selectedWorker?.id} 
                    onChange={(e) => setSelectedWorker(currentRoom.workers.find(w => w.id === e.target.value))}
                    className="w-full border border-slate-300 rounded p-2 text-sm font-semibold"
                  >
                    {currentRoom.workers.map(w => (
                      <option key={w.id} value={w.id}>{w.name} - {w.citizenId} ({w.gender === 'female' ? 'Nữ' : 'Nam'})</option>
                    ))}
                  </select>
                </div>

                <div className="flex justify-end gap-2">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-lg text-sm">Hủy</button>
                  <button onClick={handleCheckout} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-semibold">
                    Xóa & Lưu Lịch Sử Rời Đi
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 5: Báo hỏng thiết bị & Bảo trì */}
          {activeModal === 'MAINTENANCE' && currentRoom && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
                <h3 className="font-bold text-slate-800 mb-2 flex items-center gap-2">
                  <IconWrench /> Báo Hỏng Thiết Bị ({currentRoom.id})
                </h3>
                <p className="text-xs text-slate-500 mb-4">Chọn loại sự cố kỹ thuật hoặc bật trạng thái khóa phòng bảo trì:</p>

                <div className="grid grid-cols-3 gap-2 mb-5">
                  <button className="p-3 border rounded-lg text-xs font-semibold text-center hover:bg-slate-50">
                    ⚡ Hỏng Điện
                  </button>
                  <button className="p-3 border rounded-lg text-xs font-semibold text-center hover:bg-slate-50">
                    💧 Hỏng Nước
                  </button>
                  <button className="p-3 border rounded-lg text-xs font-semibold text-center hover:bg-slate-50">
                    💨 Hỏng Quạt
                  </button>
                </div>

                <div className="flex items-center justify-between p-3 bg-slate-50 rounded-lg mb-5 border">
                  <div>
                    <span className="text-sm font-bold block">Khóa phòng để sửa chữa</span>
                    <span className="text-xs text-slate-500">Không cho phép xếp thêm công nhân</span>
                  </div>
                  <button 
                    onClick={() => toggleMaintenance(currentRoom.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${currentRoom.isMaintenance ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-700'}`}
                  >
                    {currentRoom.isMaintenance ? '🔧 Đang Sửa Chữa' : 'Bình Thường'}
                  </button>
                </div>

                <div className="flex justify-end">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-lg text-sm">Đóng</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 6: Bảng lịch sử biến động trong ngày */}
          {activeModal === 'HISTORY' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl max-w-2xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center mb-4 border-b pb-2">
                  <h3 className="font-bold text-slate-800 flex items-center gap-2">
                    <IconHistory /> Nhật Ký Biến Động Nhân Sự Hôm Nay
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="overflow-y-auto flex-1">
                  {history.length === 0 ? (
                    <p className="text-center py-8 text-sm text-slate-400">Chưa ghi nhận biến động nhân sự nào trong ngày.</p>
                  ) : (
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="border-b bg-slate-50 text-slate-600">
                          <th className="p-2">Thời gian</th>
                          <th className="p-2">Họ và tên</th>
                          <th className="p-2">Giới tính</th>
                          <th className="p-2">Số CCCD</th>
                          <th className="p-2">Hành động</th>
                          <th className="p-2">Từ</th>
                          <th className="p-2">Đến</th>
                        </tr>
                      </thead>
                      <tbody>
                        {history.map(item => (
                          <tr key={item.id} className="border-b hover:bg-slate-50">
                            <td className="p-2 font-mono text-slate-500">{item.time}</td>
                            <td className="p-2 font-semibold text-slate-800">{item.name}</td>
                            <td className="p-2">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${item.gender === 'female' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700'}`}>
                                {item.gender === 'female' ? '♀ Nữ' : '♂ Nam'}
                              </span>
                            </td>
                            <td className="p-2 font-mono">{item.citizenId}</td>
                            <td className="p-2">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                item.type === 'Tiếp nhận mới' ? 'bg-emerald-100 text-emerald-700' :
                                item.type === 'Đổi phòng' ? 'bg-indigo-100 text-indigo-700' :
                                'bg-rose-100 text-rose-700'
                              }`}>
                                {item.type}
                              </span>
                            </td>
                            <td className="p-2 text-slate-500">{item.from}</td>
                            <td className="p-2 font-bold text-slate-800">{item.to}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
