<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Lịch Ca Làm Việc (.ics)</title>
  <style>
    :root {
      --color-ca1: #3498db;      /* Xanh da trời */
      --color-ca2: #f1c40f;      /* Vàng */
      --color-nghi: #e57373;     /* Đỏ nhạt */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--color-ca1);
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .btn {
      width: 100%;
      background-color: var(--color-ca1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .preview-box {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .preview-list {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-top: 10px;
    }

    .preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 0.85rem;
    }

    .tag {
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📅 Xuất Lịch Ca Trực (.ics)</h1>
    <p class="subtitle">Báo đúng giờ vào ca • Đổi tên gọn Ca 1, Ca 2 • Tô màu trực quan</p>

    <div class="legend">
      <div class="badge" style="background:#e0f2fe; color:#0369a1;">
        <span class="badge-dot" style="background:var(--color-ca1);"></span> Ca 1: Xanh da trời
      </div>
      <div class="badge" style="background:#fef9c3; color:#854d0e;">
        <span class="badge-dot" style="background:var(--color-ca2);"></span> Ca 2: Vàng
      </div>
      <div class="badge" style="background:#ffe4e6; color:#9f1239;">
        <span class="badge-dot" style="background:var(--color-nghi);"></span> Nghỉ: Đỏ nhạt
      </div>
    </div>

    <div class="form-group">
      <label for="startDate">Ngày bắt đầu</label>
      <input type="date" id="startDate">
    </div>

    <div class="form-group">
      <label for="daysCount">Số ngày muốn tạo</label>
      <input type="number" id="daysCount" value="60" min="1" max="365">
    </div>

    <div class="form-group">
      <label for="pattern">Chu kỳ xoay ca lặp lại</label>
      <select id="pattern">
        <option value="ca_1,ca_1,ca_2,ca_2,nghi,nghi">2 Ca 1 ➔ 2 Ca 2 ➔ 2 Nghỉ (Mặc định)</option>
        <option value="ca_1,ca_2,nghi">1 Ca 1 ➔ 1 Ca 2 ➔ 1 Nghỉ</option>
        <option value="ca_1,ca_1,ca_1,ca_2,ca_2,ca_2,nghi,nghi">3 Ca 1 ➔ 3 Ca 2 ➔ 2 Nghỉ</option>
      </select>
    </div>

    <button class="btn" onclick="downloadICS()">Tải file lịch (.ics) về điện thoại</button>

    <div class="preview-box">
      <label>Xem trước các ngày đầu tiên:</label>
      <div class="preview-list" id="previewList"></div>
    </div>
  </div>

  <script>
    const SHIFT_DEFS = {
      ca_1: {
        title: "Ca 1",
        color: "#3498DB",
        textColor: "#ffffff",
        start: "06:00:00",
        end: "14:00:00",
        allDay: false
      },
      ca_2: {
        title: "Ca 2",
        color: "#F1C40F",
        textColor: "#422006",
        start: "14:00:00",
        end: "22:00:00",
        allDay: false
      },
      nghi: {
        title: "Nghỉ",
        color: "#E57373",
        textColor: "#ffffff",
        start: null,
        end: null,
        allDay: true
      }
    };

    // Thiết lập ngày bắt đầu là hôm nay
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = today;

    function getSchedule() {
      const startInput = document.getElementById('startDate').value;
      const count = parseInt(document.getElementById('daysCount').value, 10) || 30;
      const pattern = document.getElementById('pattern').value.split(',');

      if (!startInput) return [];

      const schedule = [];
      const baseDate = new Date(startInput);

      for (let i = 0; i < count; i++) {
        const d = new Date(baseDate);
        d.setDate(baseDate.getDate() + i);
        const shiftType = pattern[i % pattern.length];
        schedule.push({ date: d, shiftType });
      }
      return schedule;
    }

    function updatePreview() {
      const listEl = document.getElementById('previewList');
      listEl.innerHTML = '';
      const schedule = getSchedule().slice(0, 10); // Xem 10 ngày đầu

      schedule.forEach(item => {
        const shift = SHIFT_DEFS[item.shiftType];
        const dateStr = item.date.toLocaleDateString('vi-VN', { 
          weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' 
        });

        const row = document.createElement('div');
        row.className = 'preview-item';
        row.style.background = '#f1f5f9';
        row.innerHTML = `
          <span>${dateStr}</span>
          <span class="tag" style="background:${shift.color}; color:${shift.textColor}">
            ${shift.title} ${shift.allDay ? '' : `(${shift.start.slice(0,5)} -${shift.end.slice(0,5)})`}
          </span>
        `;
        listEl.appendChild(row);
      });
    }

    function formatICSDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}${m}${day}`;
    }

    function formatICSTime(d, timeStr) {
      const datePart = formatICSDate(d);
      const cleanTime = timeStr.replace(/:/g, '');
      return `${datePart}T${cleanTime}`;
    }

    function downloadICS() {
      const schedule = getSchedule();
      if (schedule.length === 0) {
        alert("Vui lòng chọn ngày bắt đầu hợp lệ!");
        return;
      }

      const nowStr = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      let icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ShiftCalendar//VN//2026",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "X-WR-CALNAME:Lịch Ca Làm Việc",
        "X-WR-TIMEZONE:Asia/Ho_Chi_Minh"
      ];

      schedule.forEach((item, idx) => {
        const shift = SHIFT_DEFS[item.shiftType];
        const uid = `shift-${idx}-${item.date.getTime()}@myshift`;

        icsContent.push("BEGIN:VEVENT");
        icsContent.push(`UID:${uid}`);
        icsContent.push(`DTSTAMP:${nowStr}`);
        icsContent.push(`SUMMARY:${shift.title}`);
        icsContent.push(`COLOR:${shift.color}`);
        icsContent.push(`X-APPLE-CALENDAR-COLOR:${shift.color}`);

        if (shift.allDay) {
          const nextDay = new Date(item.date);
          nextDay.setDate(item.date.getDate() + 1);
          icsContent.push(`DTSTART;VALUE=DATE:${formatICSDate(item.date)}`);
          icsContent.push(`DTEND;VALUE=DATE:${formatICSDate(nextDay)}`);
        } else {
          icsContent.push(`DTSTART:${formatICSTime(item.date, shift.start)}`);
          icsContent.push(`DTEND:${formatICSTime(item.date, shift.end)}`);

          // THÔNG BÁO ĐÚNG GIỜ: 0 phút trước giờ bắt đầu
          icsContent.push("BEGIN:VALARM");
          icsContent.push("ACTION:DISPLAY");
          icsContent.push(`DESCRIPTION:Đến giờ vào ${shift.title}`);
          icsContent.push("TRIGGER:PT0M");
          icsContent.push("END:VALARM");
        }

        icsContent.push("END:VEVENT");
      });

      icsContent.push("END:VCALENDAR");

      const blob = new Blob([icsContent.join("\r\n")], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'lich_ca.ics';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // Lắng nghe thay đổi input để tự cập nhật xem trước
    document.getElementById('startDate').addEventListener('change', updatePreview);
    document.getElementById('daysCount').addEventListener('input', updatePreview);
    document.getElementById('pattern').addEventListener('change', updatePreview);

    updatePreview();
  </script>
</body>
</html>
